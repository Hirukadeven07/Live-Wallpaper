  for (const m of Object.values(MOVES)) m.spr = SPR[m.sp];
  const STAND = SPR.Walking;                     // the engine's idle pose: Walking frame 0
  const BODY = '....2222222222222222....', ARMS = '222222222222222222222222', BLANK = '........................';
  // Asleep: legs tucked in, eyes shut, breathing by one pixel.
  const SLEEP = poseSprite([
    [BODY, BODY, BODY, '....2200222222220022....', ARMS, ARMS, ARMS, ARMS, BODY, BODY, BODY, BODY],
    [BLANK, BODY, BODY, '....2200222222220022....', ARMS, ARMS, ARMS, ARMS, BODY, BODY, BODY, BODY]
  ], STAND.palette);
  const LEGS = '....22..22....22..22....';
  // Happy: eyes squeezed shut into little lines (petting, snacks, high fives).
  const HAPPY = poseSprite([[BLANK, BLANK, BODY, BODY, '....2200222222220022....', BODY, ARMS, ARMS, ARMS, ARMS,
                             BODY, BODY, BODY, BODY, LEGS, LEGS, LEGS, LEGS]], STAND.palette);
  const FLOURISHES = ['sway', 'turning', 'danceOnce', 'breakOnce', 'meditate', 'wave', 'lookAround', 'thinking'];

  // Props, as tiny multi-colour pixel pictures. Each letter maps to a colour in pal; '.' is empty.
  const PROPS = {
    cookie: { rows: ['.aaa.', 'abaaa', 'aaaba', 'abaaa', '.aaa.'], pal: { a: '#C98B4E', b: '#5A3A22' } },
    ball:   { rows: ['.ccc.', 'cciic', 'ciicc', 'ccicc', '.ccc.'], pal: { c: '#D97757', i: '#F0EEE6' } },
    mug:    { rows: ['bbbb..', 'bbbbb.', 'bbbb.b', 'bbbbb.', 'bbbb..'], pal: { b: '#5B8DB8' } },
    plane:  { rows: ['w......', '.www...', '..wwwww', '.sss...', 's......'], pal: { w: '#A9BED2', s: '#5F7A94' } }
  };
  const NOTE = ['..XX', '..X.', '..X.', 'XXX.', 'XX..'];

  // Little pixel glyphs for reactions. X = filled.
  const GLYPH = {
    heart: ['.X.X.', 'XXXXX', 'XXXXX', '.XXX.', '..X..'],
    bang: ['XX', 'XX', 'XX', 'XX', '..', 'XX'],
    question: ['.XXX.', 'X...X', '...X.', '..X..', '.....', '..X..'],
    spark: ['.X.', 'XXX', '.X.'],
    star: ['..X..', '.XXX.', 'XXXXX', '.XXX.', '..X..']
  };

  /* ---------- Clawd ---------- */
  const WALK = 16, STROLL = 24, RUN = 60, ACC = 260;   // sprite pixels per second (squared for ACC)
  const GRAV = 300;                                    // hop gravity, sprite pixels per second squared
  const C = { x: 0, y: 0, z: 0, vz: 0, vx: 0, vy: 0, facing: 1, state: 'boot', anim: null, f: 0, animRate: 1,
              idleT: 0, nextAct: 2, waved: false, goal: null, deskVar: 'laptop', deskT: 0, timer: 0,
              taps: 0, tray: null, zT: 0, sleptAt: 0, onLand: null, bounces: 0, peak: 0, started: false };
  const P = { x: null, y: null, inside: false, lastMove: -1e9, lastT: 0, anchor: null, press: null, hist: [], wakeAcc: 0,
              down: null, speed: 0, dirX: 0, turns: [], petDir: 0, rubs: [] };
  let lastActivity = now(), hoverCD = 0, hits = [], pending = null, bubble = null;
  // cooldowns and little memories for the extra interactions
  const CD = { boop: 0, whoosh: 0, beat: 0, spin: 0, plane: 0 };
  let excitedUntil = 0, petLast = 0, petHeartT = 0, emptyClicks = [], lastEmpty = null, snacksEaten = [];
  const toys = { ball: null, snack: null, plane: null };
  const parts = [];

  function play(name) { C.anim = MOVES[name]; C.f = C.anim.start; }
  function setState(state, move) { C.state = state; C.timer = 0; C.animRate = 1; if (move) play(move); else C.anim = null; }
  function idle() { setState('idle'); C.idleT = 0; C.vx = C.vy = 0; C.goal = null; C.animRate = 1; }
  function stepAnim(dt) {
    const a = C.anim;
    if (!a) return;
    C.f += a.fps * dt * C.animRate;
    if (a.loop) {
      const [l0, l1] = a.loop, n = l1 - l0 + 1;
      if (C.f >= l1 + 1) C.f = l0 + ((C.f - l0) % n);
    } else if (a.oneShot && C.f >= a.end + 1) C.anim = null;
  }
  const headY = () => C.y - SP(C.z) - SP(C.state === 'sleep' ? 12 : 16);
  const busy = () => ['boot', 'tap', 'held', 'fall', 'dizzy', 'sleep', 'yawn', 'wake', 'eat', 'coffee'].includes(C.state);
  // States where he's just pottering about and happy to drop what he's doing.
  const free = () => C.state === 'idle' || C.state === 'flourish' ||
    (C.state === 'walk' && C.goal && ['wander', 'follow', 'chase', 'click'].includes(C.goal.kind));
  function onClawd(x, y, pad) {
    pad = pad == null ? 3 : pad;
    return Math.abs(x - C.x) <= SP(12 + pad) && y <= C.y - SP(C.z) + SP(pad) && y >= headY() - SP(pad);
  }
  function face(x) { if (x != null && Math.abs(x - C.x) > SP(2)) C.facing = x > C.x ? 1 : -1; }

  function say(text, life) { if (S.bubbles) bubble = { text, t: 0, life: life || 2.6 }; }
  function emit(type, x, y, o) {
    parts.push(Object.assign({ type, x, y, vx: 0, vy: 0, t: 0, life: 1 }, o));
    if (parts.length > 90) parts.shift();
  }
  function hop(h) { if (C.z > 0.01 || C.vz > 0) return false; C.vz = Math.sqrt(2 * GRAV * (h || 5)); return true; }
  function dust(n, power) {
    for (let i = 0; i < n; i++) {
      emit('dust', C.x + rand(-6, 6) * pix, C.y, { vx: rand(-1, 1) * SP(18) * (power || 1), vy: -rand(4, 14) * pix, life: rand(0.3, 0.5) });
    }
  }
  function hearts(n) {
    for (let i = 0; i < n; i++) emit('heart', C.x + rand(-6, 6) * pix, headY() - SP(2), { vx: rand(-8, 8) * pix, vy: -rand(14, 24) * pix, life: rand(0.9, 1.3) });
  }
  function mark(type, life) { emit(type, 0, 0, { att: true, life: life || 0.9 }); }

  function goTo(x, y, speed, kind, extra) {
    C.goal = Object.assign({ x: clamp(x, minX(), maxX()), y: S.roam ? floorY : clamp(y, minY(), maxY()), speed, kind }, extra);
    if (C.state !== 'walk') setState('walk', 'walk');
  }
  // Move toward (tx, ty), easing in near the end. Returns true on arrival.
  function steer(dt, tx, ty, speed) {
    const dx = tx - C.x, dy = ty - C.y, d = Math.hypot(dx, dy);
    if (d < SP(1.5)) { C.x = tx; C.y = ty; C.vx = C.vy = 0; return true; }
    const want = Math.min(SP(speed), Math.sqrt(2 * SP(ACC) * d));
    const a = SP(ACC) * dt;
    C.vx += clamp(dx / d * want - C.vx, -a, a);
    C.vy += clamp(dy / d * want - C.vy, -a, a);
    C.x += C.vx * dt; C.y += C.vy * dt;
    if (Math.abs(dx) > SP(2)) C.facing = dx > 0 ? 1 : -1;
    return false;
  }

  function startDesk() {
    C.deskVar = Math.random() < 0.5 ? 'desktop' : 'laptop';
    setState('desk', C.deskVar);
    C.deskT = rand(8, 18);
  }
  function wander() {
    const R = Math.max(W, H) * 0.28, a = Math.random() * TAU, r = rand(0.35, 1) * R;
    const toFloor = Math.random() < 0.22;   // now and then he strolls back down to the taskbar
    goTo(C.x + Math.cos(a) * r, toFloor ? floorY : C.y + Math.sin(a) * r * 0.6, WALK, 'wander');
  }
  function cursorSpot() {
    const side = C.x < P.x ? -1 : 1;     // stay on the side he's already on
    return [P.x + side * SP(11), S.roam ? floorY : Math.min(floorY, P.y + SP(18))];
  }

  /* ---------- taskbar visits: clock and battery ---------- */
  let bat = batteryOverride;
  const BATTERY_KINDS = ['battery', 'plug', 'low', 'full'];
  // Roughly where Windows draws the clock and the battery icon, measured from the right edge.
  const trayX = kind => W - (BATTERY_KINDS.includes(kind) ? 150 : 62) * dpr;
  function startTray(kind) {
    pending = null;
    const x = trayX(kind) - SP(9);
    goTo(x, floorY, Math.abs(x - C.x) > W * 0.3 ? 40 : STROLL, 'tray', { tray: kind });
  }
  function queue(kind, wakeHim) {
    if (C.state === 'sleep' || C.state === 'yawn') { if (!wakeHim) return; wake(null); }
    pending = kind;
  }
  function trayText(kind) {
    const pct = bat ? Math.round(bat.level * 100) : null;
    switch (kind) {
      case 'hour': return 'ding! ' + new Date().toLocaleTimeString([], { hour: 'numeric' });
      case 'battery': if (pct != null) return pct + '% battery' + (bat.charging ? ' ⚡' : ''); break;
      case 'plug': return 'charging! ⚡';
      case 'full': return 'all charged!';
      case 'low': return pct + '% left... charger?';
    }
    return "it's " + new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  }
  function onBattery(level, charging) {
    const prev = bat;
    bat = { level, charging };
    if (!S.sysinfo || !prev) return;
    if (charging && !prev.charging) queue('plug', true);
    else if (charging && level >= 0.995 && prev.level < 0.995) queue('full', false);
    else if (!charging && ((level <= 0.2 && prev.level > 0.2) || (level <= 0.1 && prev.level > 0.1))) queue('low', true);
  }
  if (!batteryOverride && navigator.getBattery) {
    navigator.getBattery().then(b => {
      bat = { level: b.level, charging: b.charging };
      const upd = () => onBattery(b.level, b.charging);
      b.addEventListener('levelchange', upd);
      b.addEventListener('chargingchange', upd);
    }).catch(() => {});
  }
  let lastHour = new Date().getHours();
  function checkClock() {
    const d = new Date();
    if (d.getMinutes() === 0 && d.getHours() !== lastHour) {
      lastHour = d.getHours();
      if (S.sysinfo && S.visits > 0) queue('hour', false);
    }
  }

  /* ---------- sleeping and waking ---------- */
  function sleepLimit() {
    const sec = sleepOverride != null ? sleepOverride : SLEEP_AFTER[S.sleep];
    return sec ? (isNight() ? sec * 0.5 : sec) : 0;
  }
  function wake(x) {
    const long = now() - C.sleptAt > 600, h = hourNow();
    setState('wake');
    C.anim = null;
    hop(7);
    mark('bang');
    face(x);
    if (long && h >= 5 && h < 11) say('good morning!');
    else if (long) say('welcome back!');
    else say(pick(['huh?!', 'oh! hi', "i'm up!", '!!']));
    P.wakeAcc = 0;
    lastActivity = now();
  }
  function fallAsleep(at) {
    C.goal = null; C.vx = C.vy = 0; C.z = 0; C.vz = 0;
    setState('sleep');
    C.sleptAt = at || now();
    C.zT = 0;
  }

  /* ---------- picking him up ---------- */
  function grab() {
    setState('held', 'walk');
    C.animRate = 2.6;
    C.goal = null; C.z = 0; C.vz = 0;
    P.hist = [];
    say(pick(['whoa!', 'hey!', 'wheee']), 1.6);
  }
  function release() {
    P.press = null;
    const h = P.hist, a = h[0], b = h[h.length - 1];
    let vx = 0, vy = 0;
    if (a && b && b.t - a.t > 0.01) { vx = (b.x - a.x) / (b.t - a.t); vy = (b.y - a.y) / (b.t - a.t); }
    const lim = 2600 * dpr;
    vx = clamp(vx, -lim, lim); vy = clamp(vy, -lim, lim);
    if (Math.hypot(vx, vy) < 450 * dpr && !S.roam) {
      // set down gently where he was dropped
      setState('fall');
      C.vx = 0; C.vy = 0; C.dropTo = Math.min(floorY, C.y + SP(5));
    } else {
      setState('fall');
      C.vx = vx; C.vy = vy; C.dropTo = floorY;
    }
    C.bounces = 0; C.peak = 0;
  }
  function dizzy() {
    C.goal = null; C.vx = C.vy = 0;
    setState('dizzy', 'sway');
    say('@_@', 2.2);
  }

  /* ---------- memory: he remembers when you last visited (stays in this PC's wallpaper storage) ---------- */
  const MEM_KEY = 'clawd-desk-buddy';
  let mem = {};
  try { mem = JSON.parse(localStorage.getItem(MEM_KEY) || '{}') || {}; } catch (e) { mem = {}; }
  function saveMem() { try { localStorage.setItem(MEM_KEY, JSON.stringify(mem)); } catch (e) { /* storage off */ } }
  const today = () => new Date().toDateString();
  function greeting() {
    const first = !mem.lastDay, sameDay = mem.lastDay === today(), wd = new Date().getDay();
    mem.visits = (mem.visits || 0) + 1;
    mem.lastDay = today();
    saveMem();
    if (first) return "hi! i'm clawd";
    if (sameDay) return pick(['hi again!', 'oh, hi again', 'hi!']);
    if (wd === 5) return 'happy friday!';
    if (wd === 1) return 'monday again...';
    if (wd === 0 || wd === 6) return 'weekend mode!';
    return pick(['hi!', 'good to see you!', 'hello again!']);
  }
  const GREET = greeting();

  /* ---------- toys: snacks, the ball and paper planes ---------- */
  const propScale = () => Math.max(2, Math.round(pix * 0.9));
  const ballR = () => 2.5 * propScale();
  function dropSnack(x, y) {
    if (!S.toys) return;
    toys.snack = { x: clamp(x, minX(), maxX()), y, vy: 0, ground: S.roam ? floorY : clamp(y + SP(10), minY(), floorY), landed: false, t: 0 };
    emit('spark', x, y, { life: 0.4 });
  }
  function noticeSnack() {
    if (C.state === 'sleep' || C.state === 'yawn') { wake(toys.snack.x); say('*sniff sniff*', 1.8); }
    else if (!busy()) { mark('bang'); if (Math.random() < 0.5) say(pick(['a cookie?!', 'snack!', 'for me?']), 1.6); }
  }
  function spawnBall(x, y) {
    if (!S.toys) return;
    toys.ball = { x: clamp(x, ballR(), W - ballR()), y, vx: rand(-200, 200) * dpr, vy: 0, t: 0, kicks: 0, cd: 0.4 };
    if (C.state === 'sleep' || C.state === 'yawn') wake(x);
    else if (!busy()) { mark('bang'); say(pick(['a ball!', 'ooh!', 'ball!!']), 1.6); }
  }
  function throwPlane() {
    C.facing = C.x < W / 2 ? 1 : -1;            // throw it across the open side of the screen
    toys.plane = { x: C.x + C.facing * SP(8), y0: headY(), y: headY(), dir: C.facing, t: 0 };
    hop(3);
  }
  function kick() {
    const b = toys.ball;
    if (!b) return;
    face(b.x);
    hop(4);
    b.vx = C.facing * rand(450, 1000) * dpr;
    b.vy = -rand(500, 1100) * dpr;
    b.kicks++;
    b.cd = 0.7;
    emit('spark', b.x, b.y, { life: 0.35 });
    idle();
    C.nextAct = 1;
    if (Math.random() < 0.3) say(pick(['kick!', 'hup!', 'goal?']), 1.2);
  }
  function updateToys(dt) {
    const s = toys.snack;
    if (s) {
      s.t += dt;
      if (!s.landed) {
        s.vy += 2600 * dpr * dt;
        s.y += s.vy * dt;
        if (s.y >= s.ground) { s.y = s.ground; s.landed = true; noticeSnack(); }
      }
      if (s.t > 60 && C.state !== 'eat') toys.snack = null;
    }
    const b = toys.ball;
    if (b) {
      const r = ballR();
      b.t += dt; b.cd -= dt;
      b.vy += 2600 * dpr * dt;
      b.x += b.vx * dt; b.y += b.vy * dt;
      if (b.x < r) { b.x = r; b.vx = Math.abs(b.vx) * 0.7; }
      if (b.x > W - r) { b.x = W - r; b.vx = -Math.abs(b.vx) * 0.7; }
      if (b.y < r) { b.y = r; b.vy = Math.abs(b.vy) * 0.5; }
      if (b.y >= floorY - r) {
        b.y = floorY - r;
        b.vy = b.vy > 250 * dpr ? -b.vy * 0.55 : 0;
        b.vx *= Math.exp(-dt * 1.4);
        if (Math.abs(b.vx) < 5 * dpr) b.vx = 0;
      }
      if (b.t > 45 || b.kicks >= 10) {
        toys.ball = null;
        if (!busy()) say(pick(['that was fun!', 'good game!']), 2.2);
      }
    }
    const p = toys.plane;
    if (p) {
      p.t += dt;
      p.x += p.dir * 240 * dpr * dt;
      p.y = p.y0 + Math.sin(p.t * 2.2) * 26 * dpr + p.t * 16 * dpr;   // swoops, drifting slowly down
      if (p.x < -40 * dpr || p.x > W + 40 * dpr || p.y > floorY) toys.plane = null;
    }
  }
  // Snacks beat everything; while a ball is out he plays instead of following the cursor.
  function toysDrive() {
    const s = toys.snack, b = toys.ball, k = C.goal && C.goal.kind;
    if (s && s.landed) {
      if (C.state === 'desk') { C.deskT = 0; return true; }
      if (free() || (C.state === 'walk' && k === 'snack')) {
        if (k !== 'snack') goTo(s.x + (C.x < s.x ? -1 : 1) * SP(8), s.ground, RUN, 'snack');
        return true;
      }
    }
    if (!b) return false;
    if (b.cd <= 0 && (free() || (C.state === 'walk' && k === 'ball'))) {
      goTo(b.x + (C.x < b.x ? -1 : 1) * SP(9), floorY, 56, 'ball');   // re-aimed every frame as it rolls
      if (Math.abs(C.x - b.x) < SP(12) && b.y > floorY - ballR() - SP(6) && Math.abs(C.y - floorY) < SP(3)) kick();
    }
    return true;
  }
  function startEat() {
    C.goal = null; C.vx = C.vy = 0;
    if (toys.snack) face(toys.snack.x);
    setState('eat');
  }
  function finishEat() {
    toys.snack = null;
    hearts(2);
    const t = now();
    snacksEaten = snacksEaten.filter(e => t - e < 120);
    snacksEaten.push(t);
    if (snacksEaten.length >= 3) { snacksEaten = []; setState('yawn'); say('so full... *yawn*', 2.2); return; }
    setState('flourish', 'danceOnce');
    say(pick(['yum!', 'nom nom', 'tasty!', 'thank you!']), 1.8);
  }

  /* ---------- more ways to play ---------- */
  function startPet() {
    C.goal = null; C.vx = C.vy = 0; C.z = Math.max(0, C.z);
    setState('pet');
    say(pick(['hehe~', 'that tickles', 'mmm']), 1.8);
    mem.pets = (mem.pets || 0) + 1;
    saveMem();
  }
  function highFive(x, y) {
    for (let i = 0; i < 6; i++) emit('spark', x + rand(-6, 6) * pix, y + rand(-6, 6) * pix, { life: rand(0.35, 0.7) });
    hearts(1);
    hop(5);
    setState('flourish', 'danceOnce');
    say(pick(['high five!', 'yeah!', 'nice!']), 1.6);
  }
  function spin(text) {
    C.goal = null; C.vx = C.vy = 0;
    setState('flourish', 'turning');
    C.animRate = 2;
    if (text && Math.random() < 0.6) say(text, 1.3);
  }
  function startCoffee() {
    mem.coffeeDay = today();
    saveMem();
    C.goal = null; C.vx = C.vy = 0;
    setState('coffee');
    C.zT = 0;
    say('coffee first.', 2.4);
  }
  // Drag a selection box on the desktop: is he inside it?
  function selectionBox(x0, y0, x1, y1) {
    if (busy() || C.state === 'pet') return;
    const L = Math.min(x0, x1), R = Math.max(x0, x1), T = Math.min(y0, y1), B = Math.max(y0, y1);
    const cl = C.x - SP(11), cr = C.x + SP(11), ct = headY(), cb = C.y;
    if (cl >= L && cr <= R && ct >= T && cb <= B) {
      C.goal = null;
      hop(6);
      mark('bang');
      say(pick(["hey! don't select me", "i'm not a file!", 'nope, not a file']), 2.2);
      goTo(C.x - L < R - C.x ? L - SP(16) : R + SP(16), C.y, RUN, 'wander');   // out through the nearest side
    } else if (cr > L && cl < R && cb > T && ct < B) {
      face((L + R) / 2);
      mark('question', 0.9);
    }
  }
  // A plain click on empty desktop: double-click, a steady beat, or "what was that?"
  function emptyClick(x, y, t) {
    if (lastEmpty && t - lastEmpty.t < 0.4 && Math.hypot(x - lastEmpty.x, y - lastEmpty.y) < 30 * dpr) {
      lastEmpty = null;
      if (S.toys) { spawnBall(x, y); return; }
    } else lastEmpty = { x, y, t };
    emptyClicks.push(t);
    if (emptyClicks.length > 4) emptyClicks.shift();
    const dancing = C.state === 'flourish' && C.anim === MOVES.danceOnce && t < CD.beat;
    if (dancing) { emit('note', C.x + rand(-8, 8) * pix, headY(), { vx: rand(-6, 6) * pix, vy: -rand(12, 20) * pix, life: 1.2 }); return; }
    if (emptyClicks.length === 4 && t > CD.beat && (free() || C.state === 'desk')) {
      const iv = [1, 2, 3].map(i => emptyClicks[i] - emptyClicks[i - 1]);
      const lo = Math.min(...iv), hi = Math.max(...iv);
      if (lo > 0.22 && hi < 0.95 && hi / lo < 1.35) {
        CD.beat = t + 3.2;
        emptyClicks = [];
        C.goal = null; C.vx = C.vy = 0;
        setState('flourish', 'danceOnce');
        C.animRate = clamp(0.55 / ((lo + hi) / 2), 0.7, 1.8);   // dances faster to a faster beat
        for (let i = 0; i < 3; i++) emit('note', C.x + rand(-8, 8) * pix, headY(), { vx: rand(-6, 6) * pix, vy: -rand(12, 20) * pix, life: rand(1, 1.5) });
        say(pick(['♪ nice beat', 'ooh, a beat!', '♪♪']), 1.8);
        return;
      }
    }
    if (busy() || C.state === 'desk' || C.state === 'deskOut' || C.state === 'pet') return;
    const d = Math.hypot(x - C.x, y - (C.y - SP(8)));
    if (d < SP(40)) {
      face(x);
      if (hop(6)) mark('bang');
    } else if (S.clicks === 2 && !toys.ball) {
      mark('question', 0.8);
      const side = x > C.x ? -1 : 1;
      goTo(x + side * SP(9), y + SP(4), d > W * 0.2 ? RUN : 34, 'click', { cx: x, cy: y });
    } else face(x);
  }

  /* ---------- behaviour ---------- */
  function decide() {
    C.idleT = 0;
    C.nextAct = rand(2.5, 6.5);
    if (!C.waved) { C.waved = true; setState('flourish', 'wave'); say(GREET); return; }

      const r = seeded(7);
      for (let i = 0; i < 160; i++) {
        const sx = r() * W, sy = r() * floorY * 0.7, s = Math.max(1, Math.round((r() < 0.15 ? 2 : 1) * dpr));
        g.fillStyle = `rgba(240,238,230,${(d * (0.25 + 0.6 * r())).toFixed(3)})`;
        g.fillRect(sx, sy, s, s);
      }
    }
    const cx = W * 0.72, cy = floorY * 0.3, rad = Math.min(W, H) * 0.06;   // sun by day, moon by night
    g.fillStyle = mix('#E58F6B', '#E9E4D6', d, 0.9);
    g.beginPath(); g.arc(cx, cy, rad, 0, TAU); g.fill();
    const layers = [
      // pale sand, so Clawd's clay orange stands out against it
      { base: 0.55, amp: 0.05, f: 2.2, p: 0.4, c: mix('#EBD3B9', '#3A2D35', d) },
      { base: 0.7, amp: 0.045, f: 3.1, p: 1.9, c: mix('#E5C7A6', '#2D2329', d) },
      { base: 0.85, amp: 0.04, f: 4.3, p: 3.3, c: mix('#DDB994', '#201A1E', d) }
    ];
    for (const L of layers) {
      g.fillStyle = L.c;
      g.beginPath();
      g.moveTo(0, H);
      for (let x = 0; x <= W + 8; x += 8) {
        const u = x / H;
        g.lineTo(x, floorY * L.base - H * L.amp * (0.6 * Math.sin(u * L.f + L.p) + 0.4 * Math.sin(u * L.f * 2.3 - L.p * 1.4)));
      }
      g.lineTo(W, H);
      g.fill();
    }
  }
  function drawGlow(d) {
    const g = bctx;
    g.fillStyle = mix('#F0EEE6', '#141413', d);
    g.fillRect(0, 0, W, H);
    const R = Math.max(W, H) * 0.95;
    const glow = g.createRadialGradient(W * 0.5, floorY, 0, W * 0.5, floorY, R);
    glow.addColorStop(0, mix('#E7967A', '#7A3624', d, 0.95));
    glow.addColorStop(0.45, mix('#EFC2AE', '#3A1D16', d, 0.55));
    glow.addColorStop(1, mix('#F0EEE6', '#141413', d, 0));
    g.fillStyle = glow;
    g.fillRect(0, 0, W, H);
  }
  let picImg = null;
  function loadPicture(path) {
    picImg = null;
    bgDirty = true;
    if (!path) return;
    let p = String(path).replace(/\\/g, '/');
    if (!p.includes('/')) p = 'pictures/' + p;
    const im = new Image();
    im.onload = () => { picImg = im; bgDirty = true; };
    im.src = encodeURI(p);
  }
  function drawPicture(d) {
    if (!picImg) { drawPaper(d); return; }
    const g = bctx, k = Math.max(W / picImg.width, H / picImg.height);
    const w = picImg.width * k, h = picImg.height * k;
    g.fillStyle = '#141413';
    g.fillRect(0, 0, W, H);
    g.imageSmoothingEnabled = true;
    g.drawImage(picImg, (W - w) / 2, (H - h) / 2, w, h);
  }
  function drawBg() {
    const d = dark;
    switch (S.scene) {
      case 0: drawPaper(d); break;
      case 2: drawTerminal(); scrollDrawn = scroll; break;
      case 3: drawDunes(d); break;
      case 4: drawGlow(d); break;
      case 5: drawPicture(d); break;
      default: drawGraph(d);
    }
  }

  /* ---------- drawing Clawd and his effects ---------- */
  function glyph(rows, x, y, s, color) {
    ctx.fillStyle = color;
    const w = rows[0].length, h = rows.length;
    const ox = Math.round(x - (w * s) / 2), oy = Math.round(y - h * s);
    for (let r = 0; r < h; r++) for (let c = 0; c < w; c++) if (rows[r][c] === 'X') ctx.fillRect(ox + c * s, oy + r * s, s, s);
  }
  // Multi-colour prop, anchored at its bottom centre; flip mirrors it left-right.
  function drawProp(pr, x, y, s, flip) {
    const rows = pr.rows, w = rows[0].length, h = rows.length;
    const ox = Math.round(x - (w * s) / 2), oy = Math.round(y - h * s);
    for (let r = 0; r < h; r++) for (let c = 0; c < w; c++) {
      const ch = rows[r][flip ? w - 1 - c : c];
      if (ch === '.') continue;
      ctx.fillStyle = pr.pal[ch];
      ctx.fillRect(ox + c * s, oy + r * s, s, s);
    }
  }
  function drawToys() {
    const s = propScale(), sd = sceneDark();
    const k = toys.snack;
    if (k) {
      ctx.globalAlpha = k.t > 57 ? Math.max(0, (60 - k.t) / 3) : C.state === 'eat' ? 1 - 0.7 * clamp(C.timer / 2.2, 0, 1) : 1;
      drawProp(PROPS.cookie, k.x, k.y, s);
      ctx.globalAlpha = 1;
    }
    const b = toys.ball;
    if (b) {
      const lift = floorY - (b.y + ballR());
      ctx.fillStyle = `rgba(20,14,10,${((0.16 + 0.12 * sd) / (1 + lift / (40 * dpr))).toFixed(3)})`;
      ctx.beginPath();
      ctx.ellipse(b.x, floorY, s * 2.5, Math.max(1, s * 0.6), 0, 0, TAU);
      ctx.fill();
      ctx.globalAlpha = b.t > 43 ? Math.max(0, (45 - b.t) / 2) : 1;
      drawProp(PROPS.ball, b.x, b.y + ballR(), s, Math.floor(b.x / (s * 4)) % 2 === 1);   // pattern flips as it rolls
      ctx.globalAlpha = 1;
    }
    const p = toys.plane;
    if (p) drawProp(PROPS.plane, p.x, p.y, s, p.dir < 0);
  }
  function currentFrame() {
    if (C.state === 'sleep') return [SLEEP, Math.floor(now() / 1.4) % 2];
    if (C.state === 'yawn') return [SLEEP, 0];
    if (C.state === 'pet' || C.state === 'eat') return [HAPPY, 0];
    if (C.anim) return [C.anim.spr, clamp(C.f | 0, 0, C.anim.spr.frames.length - 1)];
    return [STAND, 0];
  }
  function drawClawd() {
    if (C.state === 'boot' && C.timer < 0.6) return;
    const [sp, fi] = currentFrame();
    const x = Math.round(C.x), feet = Math.round(C.y), y = Math.round(C.y - SP(C.z));
    const sd = sceneDark();
    if (C.state !== 'held' && C.state !== 'fall') {
      const k = 1 / (1 + C.z * 0.09);
      ctx.fillStyle = `rgba(20,14,10,${(0.16 + 0.12 * sd).toFixed(3)})`;
      ctx.beginPath();
      ctx.ellipse(x, feet, SP(9) * k, Math.max(1, SP(1.3) * k), 0, 0, TAU);
      ctx.fill();
    }
    ctx.save();
    ctx.imageSmoothingEnabled = false;
    ctx.translate(x, y);
    if (C.facing < 0) ctx.scale(-1, 1);
    ctx.drawImage(frameCanvas(sp, fi), -sp.ax * pix, -sp.ay * pix, sp.w * pix, sp.h * pix);
    ctx.restore();
    if (C.state === 'coffee') drawProp(PROPS.mug, x + C.facing * SP(13), y - SP(4), propScale(), C.facing < 0);
    if (C.state === 'dizzy') {
      const gs = Math.max(1, Math.round(pix * 0.6));
      for (let i = 0; i < 3; i++) {
        const a = now() * 5 + (i * TAU) / 3;
        glyph(GLYPH.spark, x + Math.cos(a) * SP(10), headY() - SP(1) + Math.sin(a) * SP(2.5), gs, '#E8B04A');
      }
    }
  }
  function drawParts(dt) {
    const gs = Math.max(2, Math.round(pix * 0.75)), sd = sceneDark();
    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i];
      p.t += dt;
      if (p.t >= p.life) { parts.splice(i, 1); continue; }
      const u = p.t / p.life, a = u > 0.6 ? 1 - (u - 0.6) / 0.4 : 1;
      let x, y;
      if (p.att) { x = C.x + C.facing * SP(3); y = headY() - SP(3) - SP(4) * Math.min(1, u * 4); }
      else { p.x += p.vx * dt; p.y += p.vy * dt; x = p.x; y = p.y; }
      ctx.globalAlpha = a;
      switch (p.type) {
        case 'heart': p.vy *= Math.exp(-dt * 1.5); glyph(GLYPH.heart, x, y, gs, '#E0735A'); break;
        case 'bang': glyph(GLYPH.bang, x, y, gs, '#D97757'); break;
        case 'question': glyph(GLYPH.question, x, y, gs, sd > 0.5 ? '#F0EEE6' : '#3D3929'); break;
        case 'spark': glyph(GLYPH.spark, x, y, gs, '#E8B04A'); break;
        case 'note': glyph(NOTE, x + Math.sin(p.t * 5) * SP(1.5), y, gs, sd > 0.5 ? '#F0EEE6' : '#D97757'); break;
        case 'steam': ctx.fillStyle = sd > 0.5 ? 'rgba(240,238,230,0.55)' : 'rgba(120,112,100,0.45)'; ctx.fillRect(Math.round(x + Math.sin(p.t * 6) * pix), Math.round(y), gs, gs); break;
        case 'wind': ctx.fillStyle = sd > 0.5 ? 'rgba(240,238,230,0.6)' : 'rgba(61,57,41,0.45)'; ctx.fillRect(Math.round(x), Math.round(y), SP(6), Math.max(1, Math.round(pix * 0.5))); break;
        case 'dust': p.vy += SP(40) * dt; ctx.fillStyle = p.color || (sd > 0.5 ? '#6B645A' : '#B9AE9C'); ctx.fillRect(Math.round(x), Math.round(y), Math.max(1, Math.round(pix * 0.8)), Math.max(1, Math.round(pix * 0.8))); break;
        case 'z': {
          ctx.fillStyle = sd > 0.5 ? '#F0EEE6' : '#3D3929';
          ctx.font = `700 ${Math.round((9 + u * 6) * dpr)}px "Cascadia Mono", Consolas, monospace`;
          ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
          ctx.fillText('z', x + Math.sin(p.t * 3) * SP(1.5), y);
          break;
        }
        case 'ripple': {
          const r = p.r0 + (p.r1 - p.r0) * smooth01(u);
          ctx.strokeStyle = sd > 0.5 ? 'rgba(240,238,230,0.8)' : 'rgba(217,119,87,0.9)';
          ctx.lineWidth = Math.max(1, Math.round(1.5 * dpr));
          ctx.beginPath();
          ctx.ellipse(x, y, r, p.flat ? Math.max(1, r * 0.28) : r, 0, 0, TAU);
          ctx.stroke();
          break;
        }
      }
    }
    ctx.globalAlpha = 1;
  }
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h); ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
  }
  function drawBubble(dt) {
    if (!bubble) return;
    bubble.t += dt;
    if (bubble.t >= bubble.life) { bubble = null; return; }
    const a = Math.min(1, bubble.t / 0.15, (bubble.life - bubble.t) / 0.3);
    const sd = sceneDark(), fs = Math.round(12 * dpr);
    ctx.font = `600 ${fs}px "Cascadia Mono", Consolas, ui-monospace, monospace`;
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    const tw = ctx.measureText(bubble.text).width, px = 7 * dpr, py = 5 * dpr;
    const bw = Math.round(tw + px * 2), bh = Math.round(fs + py * 2), tail = 5 * dpr;
    const hy = headY() - SP(2);
    let bx = Math.round(C.x - bw / 2), by = Math.round(hy - tail - bh - 2 * dpr);
    bx = clamp(bx, 4 * dpr, W - bw - 4 * dpr);
    by = Math.max(4 * dpr, by);
    ctx.globalAlpha = a;
    ctx.fillStyle = sd > 0.5 ? '#262624' : '#FFFFFF';
    ctx.strokeStyle = 'rgba(217,119,87,0.7)';
    ctx.lineWidth = Math.max(1, Math.round(dpr));
    roundRect(bx, by, bw, bh, 6 * dpr);
    ctx.fill(); ctx.stroke();
    const tx = clamp(C.x, bx + 8 * dpr, bx + bw - 8 * dpr);
    ctx.beginPath();
    ctx.moveTo(tx - 4 * dpr, by + bh - 0.5); ctx.lineTo(tx, by + bh + tail); ctx.lineTo(tx + 4 * dpr, by + bh - 0.5);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(tx - 4 * dpr, by + bh); ctx.lineTo(tx, by + bh + tail); ctx.lineTo(tx + 4 * dpr, by + bh);
    ctx.stroke();
    ctx.fillStyle = sd > 0.5 ? '#F0EEE6' : '#141413';
    ctx.fillText(bubble.text, bx + px, by + bh / 2 + 0.5);
    ctx.globalAlpha = 1;
  }

  /* ---------- frame loop ---------- */
  let lastFrame = 0, paused = false, pausedAt = 0;
  function frame(t) {
    requestAnimationFrame(frame);
    if (paused) return;
    if (lastFrame && t - lastFrame < (1000 / S.fps) * 0.94) return;
    const dt = lastFrame ? Math.min(0.1, (t - lastFrame) / 1000) : 0;
    lastFrame = t;
    const target = targetDark();
    if (dark !== target) {
      dark = target + (dark - target) * Math.exp(-dt * 2.2);
      if (Math.abs(dark - target) < 0.002) dark = target;
      if (S.scene !== 2) bgDirty = true;
    }
    if (S.scene === 2) { scroll += dt * 9 * dpr; if (scroll - scrollDrawn >= 1) bgDirty = true; }
    if (bgDirty) { drawBg(); bgDirty = false; }
    checkClock();
    updateClawd(dt);
    ctx.clearRect(0, 0, W, H);
    drawToys();
    drawClawd();
    drawParts(dt);
    drawBubble(dt);
  }

  /* ---------- Lively Wallpaper hooks ---------- */
  window.livelyPropertyListener = function (name, val) {
    switch (name) {
      case 'scene': S.scene = clampInt(val, 0, 5); break;
      case 'theme': S.theme = clampInt(val, 0, 3); break;
      case 'size': S.size = clampInt(val, 0, 2); resize(); break;
      case 'roam': S.roam = clampInt(val, 0, 1); break;
      case 'cursor': S.cursor = clampInt(val, 0, 3); break;
      case 'clicks': S.clicks = clampInt(val, 0, 2); break;
      case 'visits': S.visits = clampInt(val, 0, 2); break;
      case 'taskbar': S.taskbar = clampInt(val, 0, 5); resize(); break;
      case 'sleep': S.sleep = clampInt(val, 0, 4); break;
      case 'bubbles': S.bubbles = asBool(val); if (!S.bubbles) bubble = null; break;
      case 'sysinfo': S.sysinfo = asBool(val); break;
      case 'toys': S.toys = asBool(val); if (!S.toys) { toys.ball = null; toys.snack = null; toys.plane = null; } break;
      case 'fps': S.fps = FPS[clampInt(val, 0, 2)]; break;
      case 'picture': S.picture = val; loadPicture(val); break;
      default: return;
    }
    bgDirty = true;
  };
  function setPaused(p) {
    if (p === paused) return;
    paused = p;
    if (p) { pausedAt = now(); return; }
    lastFrame = 0;
    // If you were away longer than his bedtime, he dozed off while the desktop was covered.
    const lim = sleepLimit();
    if (lim && now() - pausedAt > lim && !busy() && C.started) fallAsleep(pausedAt + lim);
  }
  window.livelyWallpaperPlaybackChanged = function (data) {
    try {
      const o = typeof data === 'string' ? JSON.parse(data) : data;
      setPaused(!!(o && (o.IsPaused === true || o.isPaused === true)));
    } catch (e) { setPaused(false); }
  };
  document.addEventListener('visibilitychange', () => setPaused(document.hidden));
  const onScheme = () => { bgDirty = true; };
  if (mqDark.addEventListener) mqDark.addEventListener('change', onScheme); else mqDark.addListener(onScheme);
  addEventListener('resize', resize);

  /* ---------- start ---------- */
  resize();
  C.started = true;
  C.y = floorY;
  C.x = -SP(14);
  if (!introOn) { C.x = W * 0.16; C.waved = true; idle(); }
  if (S.picture) loadPicture(S.picture);
  if (/(^|&)debug=1/.test(location.hash.slice(1))) window.clawdDebug = { C, P, S, parts, get bubble() { return bubble; }, onBattery, say, setState, hearts, fallAsleep, startDesk, get floorY() { return floorY; },
    draw() { drawBg(); ctx.clearRect(0, 0, W, H); drawToys(); drawClawd(); drawParts(0); drawBubble(0); },
    toys, dropSnack, spawnBall, throwPlane, startCoffee, mem, get excitedUntil() { return excitedUntil; } };
  // Debug only: keep ticking in a hidden preview tab, where requestAnimationFrame is throttled.
  if (window.clawdDebug) setInterval(() => frame(performance.now()), 33);
  requestAnimationFrame(frame);
})();
</script>
</body>
