<!doctype html>

<title>Scarab Trail</title>
<!--
  Scarab Trail: a live wallpaper for Lively Wallpaper.

  A fictional low-poly overlander, the Scarab 110 Crew Cab, runs an off-road trail from
  morning to night: a rocky climb, a mud bog and a winch recovery, a river crossing, then
  camp by the fire with friends. The look is a nod to the low-poly, pastel style of
  off-road games such as Over the Hill. Everything is drawn with WebGL 2, no libraries,
  no network.

  Preview options in the URL hash (for testing in a browser):
    #t=SECONDS   start at this point of the story
    &tod=0..3    time of day: story, day, golden hour, night
    &cam=0..2    camera: close, medium, far
    &q=0..2      quality: battery saver, balanced, high
    &shadows=0   turn shadows off
    &freeze=1    hold the story still at t
-->

(() => {

  o[12] = (a11 * b07 - a10 * b09 - a12 * b06) * det; o[13] = (a00 * b09 - a01 * b07 + a02 * b06) * det;

const m4tv = (M, p) => [M[0] * p[0] + M[4] * p[1] + M[8] * p[2], M[1] * p[0] + M[5] * p[1] + M[9] * p[2], M[2] * p[0] + M[6] * p[1] + M[10] * p[2]];

/* Colors: hex is sRGB; meshes and lights work in linear light. IT() gives the pre-tonemap

/* ======================================================================
   The trail. It runs along +x; the camera watches from the +z side.
     0..55    meadow                  58..96   rocky climb (hard ledge at 80)
     96..114  descent                 119..140 mud bog, winch tree at 148.5
     184..202 river                   232..270 camp
   ====================================================================== */
const WATER_Y = -0.3;
const zc = x => 3.0 * Math.sin(x * 0.021 + 0.6) + 1.4 * Math.sin(x * 0.057 + 2.1);
const zcd = x => 0.063 * Math.cos(x * 0.021 + 0.6) + 0.0798 * Math.cos(x * 0.057 + 2.1);

const PARK_S = 241;
const CAMP_C = [250, zc(250) - 2.5];

// trail profile: [centre x, height, width] steps; the last one is the descent
const LEDGES = [[61, 0.5, 6], [64.5, 0.35, 0.8], [67.5, 0.3, 5], [71, 0.4, 0.8], [75, 0.4, 7], [80, 0.8, 0.6],

  return h;
}
const PS0 = -260, PSN = 1500, PST = new Float32Array(PSN);
for (let i = 0; i < PSN; i++) {
  const x = PS0 + i * 0.5; let s = 0, ws = 0;
  for (let k = -30; k <= 30; k++) { const w = Math.exp(-(k * k) / 200); s += prof(x + k * 0.5) * w; ws += w; }

    const n = rate('dr', 26 * wet, dt);
    for (let k = 0; k < n; k++) { const p = m4tp(body, [-2.3 + R() * 4.6, 0.58, (R() < 0.5 ? -1 : 1) * 0.9]); emit({ x: p[0], y: p[1], z: p[2], vx: 0, vy: 0, vz: 0, age: 0, life: 0.6, s0: 0.05, s1: 0.04, c: PC.splash, a: 0.8, m: 0, gr: 9.8, drag: 0.2, gy: H(p[0], p[2]) }); }
  }
  if (Math.abs(cam[0] - FIRE[0]) < 90) {   // fire sparks and smoke
    const n = rate('spk', 7 + 9 * nightK, dt);
    for (let k = 0; k < n; k++) emit({ x: FIRE[0] + (R() - 0.5) * 0.3, y: FIRE[1] + 0.3, z: FIRE[2] + (R() - 0.5) * 0.3, vx: (R() - 0.5) * 0.5, vy: 1.0 + R() * 1.3, vz: (R() - 0.5) * 0.5, age: 0, life: 0.9 + R() * 0.9, s0: 0.045, s1: 0.025, c: PC.spark, a: 1, m: 1, gr: -0.2, drag: 0.8, wind: 0.2 });
    const m2 = rate('smk', 2.4, dt);
    for (let k = 0; k < m2; k++) emit({ x: FIRE[0] + (R() - 0.5) * 0.2, y: FIRE[1] + 0.75, z: FIRE[2], vx: 0.1, vy: 0.45 + R() * 0.2, vz: (R() - 0.5) * 0.15, age: 0, life: 5 + R() * 2, s0: 0.35, s1: 2.6, c: PC.smoke, a: 0.15, m: 0, gr: -0.12, drag: 0.6, wind: 0.18 });
  }
}
function fillParticles(t, F, body, nightK, headI, tail, flick, fwd) {
  let k = 0;
  const put = (x, y, z, s, c, a, m) => { const o = k * 9; PBUF[o] = x; PBUF[o + 1] = y; PBUF[o + 2] = z; PBUF[o + 3] = s; PBUF[o + 4] = c[0]; PBUF[o + 5] = c[1]; PBUF[o + 6] = c[2]; PBUF[o + 7] = a; PBUF[o + 8] = m; k++; };
  for (const p of parts) {
    const u = p.age / p.life, fadeA = p.m === 3 ? 1 - sstep(0.75, 1, u) : (1 - u) * sstep(0, 0.08, u);
    put(p.x, p.y, p.z, lerp(p.s0, p.s1, u), p.c, p.a * fadeA, p.m);
  }
  const nearCamp = Math.abs(F.st.camS - FIRE[0]) < 95;
  if (nearCamp) {
    put(FIRE[0], FIRE[1] + 0.45, FIRE[2], 2.4 + 0.5 * flick, [1.0, 0.5, 0.18], 0.32 + 0.4 * nightK, 2);
    put(FIRE[0], FIRE[1] + 0.3, FIRE[2], 0.9, [1.0, 0.75, 0.35], 0.6, 2);
    if (nightK > 0.01) {
      const lx = LAMP_POS[0] + 0.38, ly = H(LAMP_POS[0], LAMP_POS[1]) + 1.72;
      put(lx, ly, LAMP_POS[1], 1.3, [1.0, 0.7, 0.35], 0.55 * nightK, 2);
      const bc = [[1.0, 0.8, 0.45], [1.0, 0.6, 0.55], [0.6, 0.85, 1.0], [0.75, 1.0, 0.55]];
      for (const b of STRING_BULBS) put(b[0], b[1], b[2], 0.42, bc[b[3]], 0.7 * nightK, 2);
      put(TENT[0], H(TENT[0], TENT[1]) + 0.55, TENT[1] + 1.45, 1.9, [1.0, 0.6, 0.3], 0.3 * nightK, 2);
      for (const f of FIREFLIES) {
        const a = f.a + clock * f.s, x = CAMP_C[0] + Math.cos(a) * f.r + Math.sin(clock * 0.7 + f.b) * 0.8, z = CAMP_C[1] + Math.sin(a * 1.3) * f.r * 0.6;
        const blink = Math.max(0, Math.sin(clock * 1.7 + f.b * 3)) * nightK;
        if (blink > 0.02) { const y = H(x, z) + f.h + Math.sin(clock + f.b) * 0.3; put(x, y, z, 0.06, [0.8, 1.0, 0.45], blink, 1); put(x, y, z, 0.45, [0.6, 0.9, 0.3], blink * 0.35, 2); }
      }
    }
  }
  if (headI > 0.02) for (const sz of [-1, 1]) { const p = m4tp(body, [2.42, 0.99, sz * 0.625]); put(p[0], p[1], p[2], 1.4, [1.0, 0.95, 0.82], 0.75 * headI, 2); }
  if (tail > 0.05) for (const sz of [-1, 1]) { const p = m4tp(body, [-2.52, 1.06, sz * 0.79]); put(p[0], p[1], p[2], 0.55, [1.0, 0.18, 0.1], 0.6 * tail, 2); }
  return k;
}

/* ======================================================================
   Size, frame loop, Lively hooks
   ====================================================================== */
function resize() {
  const w = Math.max(1, window.innerWidth), h = Math.max(1, window.innerHeight), dpr = window.devicePixelRatio || 1;
  const sc = Math.max(0.4, Math.min(dpr, QUAL[S.quality].cap / w));
  canvas.width = Math.round(w * sc); canvas.height = Math.round(h * sc);
}
let lastFrame = 0, paused = false, dirty = true, cpuMs = 0;
function frame(now) {
  requestAnimationFrame(frame);
  if (paused && !dirty) return;
  if (!dirty && now - lastFrame < (1000 / S.fps) * 0.94) return;
  const dt = lastFrame ? Math.min(0.1, (now - lastFrame) / 1000) : 0;
  lastFrame = now;
  if (!paused) {
    clock += dt;
    if (!FREEZE) {
      storyT += dt * S.speed;
      if (storyT >= ST.T) { storyT %= ST.T; parts.length = 0; emitCarry = {}; }
    }
  }
  const r0 = performance.now();
  if (glOK) render(paused ? 0 : dt * S.speed);
  cpuMs += (performance.now() - r0 - cpuMs) * 0.05;
  dirty = false;
}
window.livelyPropertyListener = function (name, val) {
  switch (name) {
    case 'tod': S.tod = clampInt(val, 0, 3); break;
    case 'speed': S.speed = Math.max(0.1, (Number(val) || 100) / 100); break;
    case 'camera': S.cam = clampInt(val, 0, 2); break;
    case 'fps': S.fps = FPS[clampInt(val, 0, 2)]; break;
    case 'quality': S.quality = clampInt(val, 0, 2); resize(); if (glOK) makeShadow(); break;
    case 'shadows': S.shadows = asBool(val); break;
    default: return;
  }
  dirty = true;
};
window.livelyWallpaperPlaybackChanged = function (data) {
  try { const o = typeof data === 'string' ? JSON.parse(data) : data; paused = !!(o && (o.IsPaused === true || o.isPaused === true)); }
  catch (e) { paused = false; }
  if (!paused) lastFrame = 0;
};
// for testing in a browser: __scarab.seek(seconds), __scarab.info()
window.__scarab = {
  seek(t, freeze) { storyT = clamp(t, 0, ST.T - 0.01); parts.length = 0; emitCarry = {}; if (freeze !== undefined) FREEZE = !!freeze; dirty = true; },
  info() { return { T: ST.T, WS: ST.WS, WE: ST.WE, DR: ST.DR, tP: ST.tP, tRin: ST.tRin, tRout: ST.tRout, buildMs: Math.round(BUILD_MS), storyT, glOK,
    cpuMs: +cpuMs.toFixed(2), parts: parts.length, canvas: [canvas.width, canvas.height],
    tris: { world: GEO.world.data.length / 33, grass: GEO.grass.data.length / 33, body: GEO.body.length / 33, wheel: GEO.wheel.length / 33 } }; },
};
canvas.addEventListener('webglcontextlost', e => { e.preventDefault(); glOK = false; });
canvas.addEventListener('webglcontextrestored', () => { glOK = initGL(); document.documentElement.classList.toggle('no-gl', !glOK); dirty = true; });
document.addEventListener('visibilitychange', () => { if (!document.hidden) { lastFrame = 0; dirty = true; } });
addEventListener('resize', () => { resize(); dirty = true; });

resize();
glOK = initGL();
if (!glOK) document.documentElement.classList.add('no-gl');
requestAnimationFrame(frame);
})();
</script>
