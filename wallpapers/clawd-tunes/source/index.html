  function face(x) { if (x != null && Math.abs(x - C.x) > SP(2)) C.facing = x > C.x ? 1 : -1; }
  function say(text, life) { if (S.bubbles) { bubble = { text, t: 0, life: life || 2.6 }; } }

  function emit(type, x, y, o) {

  function hearts(n) {

  function notes(n, x, y) {

  function mark(type, life) { emit(type, 0, 0, { att: true, life: life || 0.9 }); }

  // On the player's top edge, lf runs 0..1 from one end to the other.
  const ledgeW = () => Math.max(1, PL.ledge.x1 - PL.ledge.x0);
  const stageXY = lf => [PL.ledge.x0 + clamp(lf, 0, 1) * ledgeW(), PL.ledge.y];
  const lfOf = x => clamp((x - PL.ledge.x0) / ledgeW(), 0, 1);

    if (PL.center) return 0.5;

    C.leap = { x0: C.x, y0: C.y, target, then, T: dur || clamp(0.35 + d / (W * 0.9), 0.4, 1.1), h: height || Math.max(SP(14), d * 0.35), t: 0 };

  /* ---------- sleeping and waking ---------- */

    const g = bgBuf.getContext('2d'), d = dark;
    switch (S.scene) {
      case 1: drawStageLights(g, dt); break;
      case 2: drawPaper(g, d); break;
      case 3: drawDunes(g, d); break;
      case 4: drawGlow(g, d); break;
      case 5: drawPicture(g, d); break;
      default: drawAlbumGlow(g, d);
    }
  }
  let fadeT = 0;
  function startBgFade() {
    if (S.scene !== 0 && S.scene !== 1 && S.skin !== 3) { bgDirty = true; return; }
    if (bgPrev.width !== W || bgPrev.height !== H) { bgPrev.width = W; bgPrev.height = H; }
    const g = bgPrev.getContext('2d');
    g.clearRect(0, 0, W, H);
    g.drawImage(bg, 0, 0);
    fadeT = 1;
    bgDirty = true;
  }
  function composeBg() {
    bctx.globalAlpha = 1;
    bctx.drawImage(bgBuf, 0, 0);
    if (fadeT > 0) { bctx.globalAlpha = smooth01(fadeT); bctx.drawImage(bgPrev, 0, 0); bctx.globalAlpha = 1; }
    if (S.skin === 3) {
      // a small blurred copy behind the frosted glass
      const gw = Math.max(2, Math.round(W / 10)), gh = Math.max(2, Math.round(H / 10));
      if (glassBuf.width !== gw || glassBuf.height !== gh) { glassBuf.width = gw; glassBuf.height = gh; }
      const g = glassBuf.getContext('2d');
      g.filter = 'blur(3px)';
      g.drawImage(bg, 0, 0, gw, gh);
      g.filter = 'none';
    }
  }

  /* ---------- drawing Clawd and his effects ---------- */
  function glyph(rows, x, y, s, color) {
    ctx.fillStyle = color;
    const w = rows[0].length, h = rows.length;
    const ox = Math.round(x - (w * s) / 2), oy = Math.round(y - h * s);
    for (let r = 0; r < h; r++) for (let c = 0; c < w; c++) if (rows[r][c] === 'X') ctx.fillRect(ox + c * s, oy + r * s, s, s);
  }
  function drawProp(pr, x, y, s, flip) {
    const rows = pr.rows, w = rows[0].length, h = rows.length;
    const ox = Math.round(x - (w * s) / 2), oy = Math.round(y - h * s);
    for (let r = 0; r < h; r++) for (let c = 0; c < w; c++) {
      const ch = rows[r][flip ? w - 1 - c : c];
      if (ch === '.') continue;
      ctx.fillStyle = pr.pal[ch];
      ctx.fillRect(ox + c * s, oy + r * s, s, s);
    }
  }
  function currentFrame() {
    if (C.state === 'sleep') return [SLEEP, Math.floor(now() / 1.4) % 2];
    if (C.state === 'yawn') return [SLEEP, 0];
    if (C.state === 'freeze' && C.freeze) return C.freeze;
    if (C.state === 'pet' || (C.state === 'groove' && C.happyBeat && C.bob > 0.4)) return [HAPPY, 0];
    if (C.anim) return [C.anim.spr, clamp(C.f | 0, 0, C.anim.spr.frames.length - 1)];
    return [STAND, 0];
  }
  const propScale = () => Math.max(2, Math.round(pix * 0.9));
  function drawClawd() {
    if (C.state === 'boot' && !C.dropped) return;
    const [sp, fi] = currentFrame();
    const nod = (C.state === 'groove' && C.anim !== MOVES.walk) ? Math.round(C.bob * 1.4) : 0;
    const x = Math.round(C.x), feet = Math.round(C.y), y = Math.round(C.y - SP(C.z) + SP(nod));
    const sd = sceneDark();
    if (!['held', 'fall', 'leap'].includes(C.state)) {
      const k = 1 / (1 + C.z * 0.09);
      ctx.fillStyle = `rgba(20,14,10,${(0.18 + 0.12 * sd).toFixed(3)})`;
      ctx.beginPath();
      ctx.ellipse(x, feet, SP(9) * k, Math.max(1, SP(1.3) * k), 0, 0, TAU);
      ctx.fill();
    }
    ctx.save();
    ctx.imageSmoothingEnabled = false;
    ctx.translate(x, y);
    if (C.facing < 0) ctx.scale(-1, 1);
    ctx.drawImage(frameCanvas(sp, fi), -sp.ax * pix, -sp.ay * pix, sp.w * pix, sp.h * pix);
    // headphones, while Spotify's linked
    if (linked() && sp.name !== 'BreakDancing') {
      const hd = headOf(sp, fi);
      if (hd) {
        const ox = -sp.ax, oy = -sp.ay, p = pal();
        const px = (cx, cy, w, h, col) => { ctx.fillStyle = col; ctx.fillRect((ox + cx) * pix, (oy + cy) * pix, w * pix, h * pix); };
        const band = '#2B2D31', cup = css(S.skin === 1 ? [30, 215, 96] : p.accent2);
        const top = hd.y - (sp.name === 'Sleep' ? 1 : 2);
        px(hd.a + 1, top, hd.b - hd.a - 1, 1, band);
        px(hd.a - 1, top + 1, 1, 1, band); px(hd.a, top, 1, 1, band);
        px(hd.b + 1, top + 1, 1, 1, band); px(hd.b, top, 1, 1, band);
        px(hd.a - 2, top + 2, 2, 3, band); px(hd.b + 1, top + 2, 2, 3, band);
        px(hd.a - 2, top + 3, 1, 1, cup); px(hd.b + 2, top + 3, 1, 1, cup);
      }
    }
    ctx.restore();
    if (C.state === 'coffee') drawProp(PROPS.mug, x + C.facing * SP(13), y - SP(4), propScale(), C.facing < 0);
    if (C.state === 'dizzy') {
      const gs = Math.max(1, Math.round(pix * 0.6));
      for (let i = 0; i < 3; i++) {
        const a = now() * 5 + (i * TAU) / 3;
        glyph(GLYPH.spark, x + Math.cos(a) * SP(10), headY() - SP(1) + Math.sin(a) * SP(2.5), gs, '#E8B04A');
      }
    }
  }
  function drawParts(dt) {
    const gs = Math.max(2, Math.round(pix * 0.75)), sd = sceneDark(), p = pal();
    for (let i = parts.length - 1; i >= 0; i--) {
      const q = parts[i];
      q.t += dt;
      if (q.t >= q.life) { parts.splice(i, 1); continue; }
      const u = q.t / q.life, a = u > 0.6 ? 1 - (u - 0.6) / 0.4 : 1;
      let x, y;
      if (q.att) { x = C.x + C.facing * SP(3); y = headY() - SP(3) - SP(4) * Math.min(1, u * 4); }
      else { q.x += q.vx * dt; q.y += q.vy * dt; x = q.x; y = q.y; }
      ctx.globalAlpha = a;
      switch (q.type) {
        case 'heart': q.vy *= Math.exp(-dt * 1.5); glyph(GLYPH.heart, x, y, gs, '#E0735A'); break;
        case 'bang': glyph(GLYPH.bang, x, y, gs, '#D97757'); break;
        case 'question': glyph(GLYPH.question, x, y, gs, sd > 0.5 ? '#F0EEE6' : '#3D3929'); break;
        case 'spark': q.vy += SP(40) * dt; glyph(GLYPH.spark, x, y, gs, '#E8B04A'); break;
        case 'note': glyph(q.alt ? NOTE2 : NOTE, x + Math.sin(q.t * 5) * SP(1.5), y, gs, css(q.alt ? p.accent2 : p.accent)); break;
        case 'steam': ctx.fillStyle = sd > 0.5 ? 'rgba(240,238,230,0.55)' : 'rgba(120,112,100,0.45)'; ctx.fillRect(Math.round(x + Math.sin(q.t * 6) * pix), Math.round(y), gs, gs); break;
        case 'wind': ctx.fillStyle = sd > 0.5 ? 'rgba(240,238,230,0.6)' : 'rgba(61,57,41,0.45)'; ctx.fillRect(Math.round(x), Math.round(y), SP(6), Math.max(1, Math.round(pix * 0.5))); break;
        case 'dust': q.vy += SP(40) * dt; ctx.fillStyle = sd > 0.5 ? '#6B645A' : '#B9AE9C'; ctx.fillRect(Math.round(x), Math.round(y), Math.max(1, Math.round(pix * 0.8)), Math.max(1, Math.round(pix * 0.8))); break;
        case 'z': {
          ctx.fillStyle = sd > 0.5 ? '#F0EEE6' : '#3D3929';
          ctx.font = `700 ${Math.round((9 + u * 6) * dpr)}px "Cascadia Mono", Consolas, monospace`;
          ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
          ctx.fillText('z', x + Math.sin(q.t * 3) * SP(1.5), y);
          break;
        }
        case 'ripple': {
          const r = q.r0 + (q.r1 - q.r0) * smooth01(u);
          ctx.strokeStyle = sd > 0.5 ? 'rgba(240,238,230,0.8)' : 'rgba(217,119,87,0.9)';
          ctx.lineWidth = Math.max(1, Math.round(1.5 * dpr));
          ctx.beginPath();
          ctx.ellipse(x, y, r, q.flat ? Math.max(1, r * 0.28) : r, 0, 0, TAU);
          ctx.stroke();
          break;
        }
      }
    }
    ctx.globalAlpha = 1;
  }
  function drawBubble(dt) {
    if (!bubble && bubbleQ.length) { const b = bubbleQ.shift(); say(b.text, b.life); }
    if (!bubble) return;
    bubble.t += dt;
    if (bubble.t >= bubble.life) { bubble = null; return; }
    const a = Math.min(1, bubble.t / 0.15, (bubble.life - bubble.t) / 0.3);
    const sd = sceneDark(), fs = Math.round(12 * dpr);
    ctx.font = `600 ${fs}px "Cascadia Mono", Consolas, ui-monospace, monospace`;
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    const tw = ctx.measureText(bubble.text).width, px = 7 * dpr, py = 5 * dpr;
    const bw = Math.round(tw + px * 2), bh = Math.round(fs + py * 2), tail = 5 * dpr;
    const hy = headY() - SP(3);
    let bx = Math.round(C.x - bw / 2), by = Math.round(hy - tail - bh - 2 * dpr);
    bx = clamp(bx, 4 * dpr, W - bw - 4 * dpr);
    by = Math.max(4 * dpr, by);
    ctx.globalAlpha = a;
    ctx.fillStyle = sd > 0.5 ? '#262624' : '#FFFFFF';
    ctx.strokeStyle = 'rgba(217,119,87,0.7)';
    ctx.lineWidth = Math.max(1, Math.round(dpr));
    rrect(ctx, bx, by, bw, bh, 6 * dpr);
    ctx.fill(); ctx.stroke();
    const tx = clamp(C.x, bx + 8 * dpr, bx + bw - 8 * dpr);
    ctx.beginPath();
    ctx.moveTo(tx - 4 * dpr, by + bh - 0.5); ctx.lineTo(tx, by + bh + tail); ctx.lineTo(tx + 4 * dpr, by + bh - 0.5);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(tx - 4 * dpr, by + bh); ctx.lineTo(tx, by + bh + tail); ctx.lineTo(tx + 4 * dpr, by + bh);
    ctx.stroke();
    ctx.fillStyle = sd > 0.5 ? '#F0EEE6' : '#141413';
    ctx.fillText(bubble.text, bx + px, by + bh / 2 + 0.5);
    ctx.globalAlpha = 1;
  }

  /* ---------- frame loop ---------- */
  let lastFrame = 0, paused = false, pausedAt = 0;
  function frame(t) {
    requestAnimationFrame(frame);
    if (paused) return;
    if (lastFrame && t - lastFrame < (1000 / S.fps) * 0.94) return;
    const dt = lastFrame ? Math.min(0.1, (t - lastFrame) / 1000) : 0;
    lastFrame = t;
    tick(dt);
  }
  function tick(dt) {
    const target = targetDark();
    if (dark !== target) {
      dark = target + (dark - target) * Math.exp(-dt * 2.2);
      if (Math.abs(dark - target) < 0.002) dark = target;
      bgDirty = true;
    }
    // demo when asked for, or (if that setting's on) until Spotify is linked
    const wantDemo = hashDemo || (S.demo && !(M.on && M.link !== 'demo'));
    if (wantDemo !== D.on) { if (wantDemo) demoStart(); else demoStop(); }
    if (D.on) demoTick(); else pollTick(dt);
    if (ART.fade > 0) ART.fade = Math.max(0, ART.fade - dt / 0.6);
    if (ART.palT < 1) { ART.palT = Math.min(1, ART.palT + dt / 0.9); if (S.scene === 1 || S.scene === 0) bgDirty = true; }
    if (M.playing) { recAngle += dt * (drag && drag.kind === 'record' && drag.scratch ? 0 : 3.49); discAngle += dt * 0.7; }
    if (toast) { toast.t += dt; if (toast.t > toast.life) toast = null; }
    PL = layoutPlayer();
    audioTick(dt);
    updateClawd(dt);
    let compose = false;
    if (S.scene === 1) bgDirty = true;
    if (bgDirty) { renderBg(dt); bgDirty = false; compose = true; }
    if (fadeT > 0) { fadeT = Math.max(0, fadeT - dt / 0.9); compose = true; }
    if (compose) composeBg();
    ctx.clearRect(0, 0, W, H);
    drawViz();
    drawPlayer();
    drawClawd();
    drawParts(dt);
    drawBubble(dt);
  }

  /* ---------- Lively Wallpaper hooks ---------- */
  window.livelyPropertyListener = function (name, val) {
    switch (name) {
      case 'style': S.style = clampInt(val, 0, 4); afterLayoutChange(); break;
      case 'place':
        // Lively sends every setting on start-up, so only a real change forgets where you dragged the player.
        S.place = clampInt(val, 0, 6);
        if (mem.place !== S.place) { mem.place = S.place; mem.pos = {}; saveMem(); }
        afterLayoutChange();
        break;
      case 'spotX': case 'spotY': {
        // Moving a slider is a real change too: the sliders win over a dragged spot.
        S[name] = clampInt(val, 0, 100);
        const k = 'last' + name;
        if (mem[k] !== S[name]) { if (mem[k] != null) mem.pos = {}; mem[k] = S[name]; saveMem(); }
        afterLayoutChange();
        break;
      }
      case 'margin': S.margin = clampInt(val, 0, 200); afterLayoutChange(); break;
      case 'resetPlace': if (now() > 3) { mem.pos = {}; saveMem(); afterLayoutChange(); } break;
      case 'psize': S.psize = clampInt(val, 0, 2); afterLayoutChange(); break;
      case 'skin': S.skin = clampInt(val, 0, 4); break;
      case 'viz': S.viz = clampInt(val, 0, 3); break;
      case 'timeLeft': S.timeLeft = clampInt(val, 0, 1); break;
      case 'scene': S.scene = clampInt(val, 0, 5); break;
      case 'picture': S.picture = val; loadPicture(val); break;
      case 'theme': S.theme = clampInt(val, 0, 3); break;
      case 'size': S.size = clampInt(val, 0, 2); resize(); break;
      case 'energy': S.energy = clampInt(val, 0, 2); break;
      case 'cursor': S.cursor = clampInt(val, 0, 1); break;
      case 'sleep': S.sleep = clampInt(val, 0, 4); break;
      case 'songNames': S.songNames = asBool(val); break;
      case 'bubbles': S.bubbles = asBool(val); if (!S.bubbles) { bubble = null; bubbleQ = []; } break;
      case 'demo': S.demo = asBool(val); break;
      case 'taskbar': S.taskbar = clampInt(val, 0, 5); resize(); break;
      case 'fps': S.fps = FPS[clampInt(val, 0, 2)]; break;
      default: return;
    }
    bgDirty = true;
  };
  // The player moved or changed shape: Clawd hops back onto its new top edge.
  function afterLayoutChange() {
    PL = layoutPlayer();
    armAng = null;
    if (!C.started || C.state === 'boot') return;
    if (C.on === 'stage') { if (['leap', 'press'].includes(C.state)) return; C.lf = homeLf() != null ? homeLf() : clamp(C.lf, 0, 1); C.z = 0; hop(6); }
  }
  function setPaused(p) {
    if (p === paused) return;
    paused = p;
    if (p) { pausedAt = now(); return; }
    lastFrame = 0;
    const lim = sleepLimit();
    if (lim && !M.playing && now() - pausedAt > lim && !busy() && C.started) fallAsleep(pausedAt + lim);
  }
  window.livelyWallpaperPlaybackChanged = function (data) {
    try {
      const o = typeof data === 'string' ? JSON.parse(data) : data;
      setPaused(!!(o && (o.IsPaused === true || o.isPaused === true)));
    } catch (e) { setPaused(false); }
  };
  document.addEventListener('visibilitychange', () => setPaused(document.hidden));
  const onScheme = () => { bgDirty = true; };
  if (mqDark.addEventListener) mqDark.addEventListener('change', onScheme); else mqDark.addListener(onScheme);
  addEventListener('resize', resize);

  /* ---------- start ---------- */
  resize();
  C.started = true;
  C.on = 'stage';
  C.lf = homeLf() != null ? homeLf() : 0.5;
  [C.x, C.y] = stageXY(C.lf);
  if (!introOn) { C.state = 'idle'; C.waved = true; C.dropped = true; idle(); }
  if (S.picture) loadPicture(S.picture);
  if (/(^|&)debug=1/.test(location.hash.slice(1))) {
    window.tunesDebug = { C, M, S, A, ART, mem, get PL() { return PL; }, get bubble() { return bubble; }, ingest, say, setState, runAct, seekTo, setVolume,
                          pressButton, fallAsleep, tick, onBeat, onDrop, livelyPropertyListener: window.livelyPropertyListener };
    // Debug only: keep ticking in a hidden preview tab, where requestAnimationFrame is throttled.
    setInterval(() => frame(performance.now()), 33);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
