    gl.shaderSource(sh, src);
    gl.compileShader(sh);
    if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(sh) || 'shader compile failed');
    return sh;
  }
  function initGL() {
    try {
      if (!gl) gl = canvas.getContext('webgl2', { antialias: false, alpha: false, depth: false, stencil: false, premultipliedAlpha: false, preserveDrawingBuffer: false, powerPreference: 'low-power' });
      if (!gl) return false;
      prog = gl.createProgram();
      gl.attachShader(prog, compile(gl.VERTEX_SHADER, VS));
      gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FS));
      gl.linkProgram(prog);
      if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog) || 'program link failed');
      U = {};
      ['uRes', 'uDark', 'uGlow', 'uTw', 'uPh', 'uStars', 'uGrain'].forEach(n => { U[n] = gl.getUniformLocation(prog, n); });
      vao = gl.createVertexArray();
      return true;
    } catch (e) {
      console.warn('[Clawd Dunes] WebGL 2 is unavailable, drawing a simpler background instead.', e);
      return false;
    }
  }

  /* ---------- layout ---------- */
  let W = 2, H = 2, glow = [0.29, -0.01, 0.22];
  function glowFor(aspect) {
    if (aspect >= 1) return [Math.min(0.18 * aspect, 0.5 * aspect - 0.24), -0.01, 0.22];
    return [0, 0.05, clamp(0.23 * aspect, 0.11, 0.22)];
  }
  let pix = 14;                              // device pixels per sprite pixel
  const unit = v => v * pix / 6;             // engine game units -> device pixels (one sprite pixel = 6 units)
  let dirty = true;
  function resize() {
    const w = window.innerWidth || 1, h = window.innerHeight || 1;
    const dpr = window.devicePixelRatio || 1;
    let nw = Math.round(w * dpr), nh = Math.round(h * dpr);
    const maxPx = 3840 * 2160;
    if (nw * nh > maxPx) { const k = Math.sqrt(maxPx / (nw * nh)); nw = Math.round(nw * k); nh = Math.round(nh * k); }
    nw = Math.max(2, nw); nh = Math.max(2, nh);
    const sx = nw / W;
    for (const c of [canvas, fb, overlay]) if (c.width !== nw || c.height !== nh) { c.width = nw; c.height = nh; }
    if (C.x !== 0) { C.x *= sx; C.vx *= sx; if (C.target != null) C.target *= sx; }
    W = nw; H = nh;
    glow = glowFor(W / H);
    pix = Math.max(3, Math.round(H * SIZES[S.size]));
    lastRect = null;
    octx.clearRect(0, 0, W, H);
    dirty = true;
    if (!glOK) drawFallback();
  }
  // Screen y (device pixels from the top) of the crest Clawd walks on, at device x.
  function groundAt(x) {
    return H * 0.5 - duneY((x - 0.5 * W) / H, 1) * H;
  }

  /* ---------- background drawing ---------- */
  let simTime = (Date.now() / 1000) % 100000;
  function drawGL() {
    gl.viewport(0, 0, W, H);
    gl.useProgram(prog);
    gl.bindVertexArray(vao);
    gl.uniform2f(U.uRes, W, H);
    gl.uniform1f(U.uDark, dark);
    gl.uniform3f(U.uGlow, glow[0], glow[1], glow[2]);
    gl.uniform1f(U.uTw, simTime % 3600);
    gl.uniform1fv(U.uPh, phases);
    gl.uniform1f(U.uStars, S.stars ? 1 : 0);
    gl.uniform1f(U.uGrain, S.grain ? 0.022 : 0.005);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }
  // Flat-colored version of the same dunes for machines without WebGL 2.
  function drawFallback() {
    const c = fb.getContext('2d');
    const night = targetDark() >= 0.5;
    const sky = c.createLinearGradient(0, 0, 0, H * 0.62);
    sky.addColorStop(0, night ? '#0f0f0e' : '#f5f1e9');
    sky.addColorStop(1, night ? '#291d17' : '#f4d9c1');
    c.fillStyle = sky;
    c.fillRect(0, 0, W, H);
    const gx = W * 0.5 + glow[0] * H, gy = H * 0.5 - glow[1] * H, gr = glow[2] * H * 2.4;
    const g = c.createRadialGradient(gx, gy, 0, gx, gy, gr);
    g.addColorStop(0, night ? 'rgba(115,48,28,.55)' : 'rgba(248,198,166,.6)');
    g.addColorStop(1, 'rgba(0,0,0,0)');
    c.fillStyle = g;
    c.fillRect(0, 0, W, H);
    const cols = night ? ['#2d2926', '#252220', '#1e1c1a', '#181614', '#121110'] : ['#efdec3', '#e6c4a0', '#d8a27f', '#c9785a', '#a0553d'];
    for (let i = 0; i < 5; i++) {
      c.beginPath();
      c.moveTo(0, H);
      for (let x = 0; x <= W + 8; x += 8) c.lineTo(x, H * 0.5 - duneY((x - 0.5 * W) / H, i) * H);
      c.lineTo(W, H);
      c.closePath();
      c.fillStyle = cols[i];
      c.fill();
    }
  }

  /* ---------- Clawd ----------
     Sprites, move definitions and behavior constants come from the Claude desktop app's
     @ant/clawd-quest engine (its idle "title screen" mode). Desk sessions, looking around and
     thinking are additions for the wallpaper. */
  function decodeSprite(name) {
    const t = CLAWD_SPRITES[name];
    const frames = [];
    const r = Uint8Array.from([...t.base].map(ch => (ch === '.' ? 255 : parseInt(ch, 36))));
    frames.push(r.slice());
    for (const d of t.deltas.split('|')) {
      if (d) for (const tok of d.split(',')) {
        const e = tok.length - 1;
        r[parseInt(tok.slice(0, e), 36)] = tok[e] === '.' ? 255 : parseInt(tok[e], 36);
      }
      frames.push(r.slice());
    }
    const a0 = t.a0 && t.a0[2] > 0 ? t.a0 : [0, 0, t.w, t.h];
    return { w: t.w, h: t.h, palette: t.palette, ax: a0[0] + a0[2] / 2, ay: a0[1] + a0[3], frames, cache: [] };
  }
  function frameCanvas(sp, i) {
    let c = sp.cache[i];
    if (!c) {
      c = document.createElement('canvas');
      c.width = sp.w; c.height = sp.h;
      const cx = c.getContext('2d'), img = cx.createImageData(sp.w, sp.h), f = sp.frames[i];
      for (let k = 0; k < f.length; k++) {
        if (f[k] === 255) continue;
        const hex = sp.palette[f[k]];
        img.data[k * 4] = parseInt(hex.slice(1, 3), 16);
        img.data[k * 4 + 1] = parseInt(hex.slice(3, 5), 16);
        img.data[k * 4 + 2] = parseInt(hex.slice(5, 7), 16);
        img.data[k * 4 + 3] = 255;
      }
      cx.putImageData(img, 0, 0);
      sp.cache[i] = c;
    }
    return c;
  }
  const SPR = {};
  for (const name of Object.keys(CLAWD_SPRITES)) SPR[name] = decodeSprite(name);
  const MOVES = {
    walk:       { sp: 'Walking', start: 4, loop: [5, 9], fps: 19 },
    wave:       { sp: 'Waving', start: 3, end: 16, fps: 12, oneShot: true },
    sway:       { sp: 'Swaying', start: 4, end: 48, fps: 12, oneShot: true },
    turning:    { sp: 'Turning', start: 2, end: 26, fps: 12, oneShot: true },
    danceOnce:  { sp: 'DancingHappy', start: 4, end: 38, fps: 12, oneShot: true },
    breakOnce:  { sp: 'BreakDancing', start: 2, end: 27, fps: 12, oneShot: true },
    meditate:   { sp: 'Meditating', start: 2, end: 59, fps: 12, oneShot: true },
    lookAround: { sp: 'LookingAround', start: 4, end: 30, fps: 12, oneShot: true },
    thinking:   { sp: 'Thinking', start: 2, end: 36, fps: 12, oneShot: true },
    laptop:     { sp: 'Laptop', start: 2, loop: [17, 33], fps: 12 },
    laptopOut:  { sp: 'Laptop', start: 34, end: 42, fps: 16, oneShot: true },
    desktop:    { sp: 'Desktop', start: 2, loop: [15, 75], fps: 12 },
    desktopOut: { sp: 'Desktop', start: 76, end: 87, fps: 16, oneShot: true }
  };
  for (const m of Object.values(MOVES)) m.spr = SPR[m.sp];
  const STAND = SPR.Walking;                           // the engine's idle pose: Walking frame 0
  // Engine constants for the idle mode, in game units and seconds.
  const SPEED = 58, ACCEL = 1400, BRAKE = 1600, ARRIVE = 6, STOP = 4, LOOK = 26, WALK_RATE = 0.68;
  const FLOURISHES = ['sway', 'turning', 'danceOnce', 'breakOnce', 'meditate', 'wave'];   // the engine's idle set
  const EXTRA = ['lookAround', 'thinking'];

  const C = { x: 0, vx: 0, facing: 1, state: 'boot', anim: null, f: 0, animRate: 1, idleT: 0, nextFlourish: 2.5,
              waved: false, target: null, deskVar: 'laptop', deskT: 0, bootT: 0 };
  let ptrX = null;

  function play(name) { C.anim = MOVES[name]; C.f = C.anim.start; }
  function setState(state, move) { C.state = state; if (move) play(move); else C.anim = null; }
  function stepAnim(dt) {
    const a = C.anim;
    if (!a) return;
    C.f += a.fps * dt * C.animRate;
    if (a.loop) {
      const [l0, l1] = a.loop, n = l1 - l0 + 1;
      if (C.f >= l1 + 1) C.f = l0 + ((C.f - l0) % n);
    } else if (a.oneShot && C.f >= a.end + 1) C.anim = null;
  }
  function startDesk(variant) {
    C.deskVar = variant || (Math.random() < 0.5 ? 'desktop' : 'laptop');   // same 50/50 pick as the engine
    setState('emote', C.deskVar);
    C.vx = 0;
    C.deskT = 8 + Math.random() * 12;
  }
  function startMove(name) {
    if (name === 'laptop' || name === 'desktop') startDesk(name);
    else if (name === 'walk') C.target = W * 0.5 + (C.x < W * 0.5 ? 1 : -1) * 0.3 * W;
    else if (MOVES[name]) setState('flourish', name);
  }
  function placeIdle() {
    C.x = W * 0.5 - 0.18 * W;
    C.vx = 0;
    setState('idle');
  }

  function updateClawd(dt) {
    const home = W * 0.5;
    if (C.state === 'boot') {
      // walk in from beyond the left edge to 32% of the width, as the engine does at start-up
      C.bootT += dt;
      if (C.x === 0) C.x = -unit(80) - STAND.w * pix;
      if (C.bootT < 0.8) return;
      if (C.anim !== MOVES.walk) { play('walk'); C.facing = 1; }
      C.animRate = WALK_RATE;
      const to = home - 0.18 * W;
      C.x = Math.min(to, C.x + unit(SPEED) * dt);
      stepAnim(dt);
      if (C.x >= to) {
        setState('idle');
        C.animRate = 1;
        if (forcedMove) { startMove(forcedMove); forcedMove = null; }
      }
      return;
    }
    if (mqReduce.matches) { C.vx = 0; return; }

    let dir = 0;
    if (C.target != null) {
      C.target = clamp(C.target, home - 0.36 * W, home + 0.36 * W);
      if (C.state !== 'flourish' && C.state !== 'emote' && C.state !== 'emoteOut') {
        const d = C.target - C.x;
        if (Math.abs(d) < unit(ARRIVE)) C.target = null;
        else dir = d > 0 ? 1 : -1;
      }
    }
    if (dir !== 0) C.facing = dir;
    else if (S.cursor && ptrX != null && (C.state === 'flourish' || (C.state === 'idle' && C.idleT > 0.35))) {
      const d = ptrX - C.x;
      if (Math.abs(d) > unit(LOOK)) C.facing = d > 0 ? 1 : -1;
    }

    const targetV = (C.state === 'emote' || C.state === 'emoteOut' ? 0 : dir) * unit(SPEED);
    C.animRate = C.state === 'walk' ? WALK_RATE : 1;
    if (C.state === 'walk' && C.anim !== MOVES.walk) play('walk');
    const acc = Math.sign(targetV - C.vx) === Math.sign(C.vx) || C.vx === 0 ? unit(ACCEL) : unit(BRAKE);
    if (C.vx < targetV) C.vx = Math.min(targetV, C.vx + acc * dt);
    else if (C.vx > targetV) C.vx = Math.max(targetV, C.vx - acc * dt);
    C.x += C.vx * dt;

    if (C.state !== 'emote' && C.state !== 'emoteOut' && C.state !== 'flourish') {
      if (dir !== 0 && C.state !== 'walk') setState('walk', 'walk');
      if (dir === 0 && C.state === 'walk' && Math.abs(C.vx) < unit(STOP)) setState('idle');
    }

    if (C.state === 'idle') {
      if (C.target == null && Math.abs(C.x - home) > 0.36 * W) C.target = home + Math.sign(C.x - home) * 0.15 * W;
      C.idleT += dt;
      if (C.idleT > C.nextFlourish) {
        C.idleT = 0;
        if (!C.waved) { setState('flourish', 'wave'); C.waved = true; }
        else if (Math.random() < 0.4) C.target = home + (Math.random() - 0.5) * 0.62 * W;
        else if (Math.random() < 0.25) startDesk();
        else {
          const pool = FLOURISHES.concat(EXTRA);
          setState('flourish', pool[Math.floor(Math.random() * pool.length)]);
        }
        C.nextFlourish = 2.2 + Math.random() * 3.4;
      }
    } else C.idleT = 0;

    stepAnim(dt);
    if (C.state === 'emote') {
      C.deskT -= dt;
      if (C.deskT <= 0) setState('emoteOut', C.deskVar + 'Out');
    }
    if ((C.state === 'emoteOut' || C.state === 'flourish') && !C.anim) setState('idle');
  }

  let lastRect = null;
  function drawClawd() {
    if (lastRect) { octx.clearRect(lastRect[0], lastRect[1], lastRect[2], lastRect[3]); lastRect = null; }
    if (!S.clawd || (C.state === 'boot' && !C.anim)) return;   // nothing to draw before the walk-in starts
    const sp = C.anim ? C.anim.spr : STAND;
    const fi = C.anim ? clamp(C.f | 0, 0, sp.frames.length - 1) : 0;
    const x = Math.round(C.x), y = Math.round(groundAt(C.x) + pix * 0.5);
    // soft contact shadow on the sand
    const sw = pix * 10, sh = Math.max(2, pix * 1.2);
    octx.fillStyle = `rgba(20, 14, 10, ${(0.15 + 0.13 * dark).toFixed(3)})`;
    octx.beginPath();
    octx.ellipse(x, y - pix * 0.25, sw, sh, 0, 0, TAU);
    octx.fill();
    // the sprite, anchored at the bottom centre of its body box and mirrored when facing left
    octx.save();
    octx.imageSmoothingEnabled = false;
    octx.translate(x, y);
    if (C.facing < 0) octx.scale(-1, 1);
    octx.drawImage(frameCanvas(sp, fi), -sp.ax * pix, -sp.ay * pix, sp.w * pix, sp.h * pix);
    octx.restore();
    const half = (Math.max(sp.ax, sp.w - sp.ax) + 2) * pix;
    lastRect = [x - Math.max(half, sw) - 2, y - (sp.ay + 2) * pix, 2 * Math.max(half, sw) + 4, (sp.h + 4) * pix + 2 * sh];
  }

  /* ---------- frame loop ---------- */
  let lastFrame = 0, paused = false;
  function frame(now) {
    requestAnimationFrame(frame);
    if (paused && !dirty) return;
    if (!dirty && now - lastFrame < (1000 / S.fps) * 0.94) return;
    const dt = lastFrame ? Math.min(0.25, (now - lastFrame) / 1000) : 0;
    lastFrame = now;
    const target = targetDark();
    const settled = dark === target;
    if (!settled) {
      dark = target + (dark - target) * Math.exp(-dt * 2.2);
      if (Math.abs(dark - target) < 0.001) dark = target;
    }
    if (!paused && glOK) simTime += dt * S.motion;
    setPhases(simTime);
    if (!paused) updateClawd(dt);
    if (glOK && (dirty || !settled || S.motion > 0)) drawGL();
    else if (!glOK && (dirty || !settled)) drawFallback();
    drawClawd();
    dirty = false;
  }

  /* ---------- Lively Wallpaper hooks ---------- */
  window.livelyPropertyListener = function (name, val) {
    switch (name) {
      case 'theme': S.theme = clampInt(val, 0, 3); break;
      case 'motion': S.motion = Math.max(0, Number(val) || 0) / 100; break;
      case 'fps': S.fps = FPS[clampInt(val, 0, 2)]; break;
      case 'stars': S.stars = asBool(val); break;
      case 'grain': S.grain = asBool(val); break;
      case 'clawd': S.clawd = asBool(val); break;
      case 'cursor': S.cursor = asBool(val); break;
      case 'size': S.size = clampInt(val, 0, 2); resize(); break;
      default: return;
    }
    dirty = true;
  };
  window.livelyWallpaperPlaybackChanged = function (data) {
    try {
      const o = typeof data === 'string' ? JSON.parse(data) : data;
      paused = !!(o && (o.IsPaused === true || o.isPaused === true));
    } catch (e) { paused = false; }
    if (!paused) lastFrame = 0; // resume without a jump
  };

  /* ---------- start ---------- */
  addEventListener('pointermove', e => { ptrX = e.clientX * (W / (window.innerWidth || W)); }, { passive: true });
  canvas.addEventListener('webglcontextlost', e => { e.preventDefault(); glOK = false; });
  canvas.addEventListener('webglcontextrestored', () => {
    glOK = initGL();
    document.documentElement.classList.toggle('no-gl', !glOK);
    if (!glOK) drawFallback();
    dirty = true;
  });
  const onScheme = () => { dirty = true; };
  if (mqDark.addEventListener) mqDark.addEventListener('change', onScheme); else mqDark.addListener(onScheme);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) { lastFrame = 0; dirty = true; } });
  addEventListener('resize', resize);

  setPhases(simTime);
  glOK = initGL();
  if (!glOK) document.documentElement.classList.add('no-gl');
  resize();
  if (!introOn || mqReduce.matches) {
    placeIdle();
    if (forcedMove) { startMove(forcedMove); forcedMove = null; }
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
